[project]
name = "reel-watcher"
version = "0.1.0"
description = "Have a local AI model watch the Instagram reels you saved and write structured notes. Apple Silicon, analysis is local."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jacob Bruce" }]
requires-python = ">=3.11"
dependencies = [
    "mlx-vlm>=0.7.4",
    "mlx-whisper>=0.4.3",
    "numpy>=2.0",
    "pillow>=11.0",
    "pyobjc-framework-Vision>=10.0",
]

[project.scripts]
reel-watcher = "reel_watcher.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reel_watcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
